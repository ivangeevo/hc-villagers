plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

fabricApi {
    configureDataGeneration() {
        modId = "hc_villagers"
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "hc_villagers" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// Mixin hotswapping in dev (https://wiki.fabricmc.net/tutorial:mixin_hotswaps).
// Adds the Mixin java agent to every Loom run config, so it survives Gradle syncs (Loom regenerates
// .idea/runConfigurations on every sync, which wipes hand-edited VM options).
// Done in afterEvaluate so the classpath is only resolved after all dependencies are declared.
afterEvaluate {
    def mixinJar = configurations.runtimeClasspath.find { it.name.startsWith("sponge-mixin") }
    if (mixinJar != null) {
        loom.runs.configureEach {
            vmArg "-javaagent:${mixinJar.absolutePath}"
            vmArg "-Dmixin.hotSwap=true"
        }
    } else {
        logger.warn("sponge-mixin jar not found on the runtime classpath; mixin hotswapping is disabled")
    }
}

repositories {
    maven { url "https://api.modrinth.com/maven"}
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // BTWR Shared Library
    modImplementation "maven.modrinth:btwr-shared-library:${project.btwr_sl_version}"
    //modImplementation files("libs/btwr-shared-lib-${project.btwr_sl_version}.jar")

    // BTWR-related mods are optional: compile-only, so they are not pulled into runtime or published dependencies.
    // Trades look their items up by registry ID (see ModItemRef) and fall back to vanilla items when a mod is missing.
    // To test WITH these mods in runClient, add the same coordinates as modLocalRuntime.

    modCompileOnly "maven.modrinth:btwr-core:${project.btwr_core_version}"
    modCompileOnly "maven.modrinth:btwr-ds:${project.btwr_ds_version}"
    modCompileOnly "maven.modrinth:better-with-time:${project.bwt_version}"
    modCompileOnly "maven.modrinth:bwt-hc-tweaks:${project.bwt_hct_version}"
    modCompileOnly "maven.modrinth:sturdy-trees:${project.sturdy_trees_version}"
    modCompileOnly "maven.modrinth:tough-environment:${project.tough_environment_version}"
    modCompileOnly "maven.modrinth:self-sustainable:${project.self_sustainable_version}"
    modCompileOnly "maven.modrinth:vegehenna:${project.vegehenna_version}"
    modCompileOnly "maven.modrinth:animageddon:${project.animageddon_version}"
    modCompileOnly "maven.modrinth:granular-hunger:${project.granular_hunger_version}"

    modLocalRuntime "maven.modrinth:btwr-core:${project.btwr_core_version}"
    modLocalRuntime "maven.modrinth:btwr-ds:${project.btwr_ds_version}"
    modLocalRuntime "maven.modrinth:better-with-time:${project.bwt_version}"
    modLocalRuntime "maven.modrinth:bwt-hc-tweaks:${project.bwt_hct_version}"
    modLocalRuntime "maven.modrinth:sturdy-trees:${project.sturdy_trees_version}"
    modLocalRuntime "maven.modrinth:tough-environment:${project.tough_environment_version}"
    modLocalRuntime "maven.modrinth:self-sustainable:${project.self_sustainable_version}"
    modLocalRuntime "maven.modrinth:vegehenna:${project.vegehenna_version}"
    modLocalRuntime "maven.modrinth:animageddon:${project.animageddon_version}"
    modLocalRuntime "maven.modrinth:granular-hunger:${project.granular_hunger_version}"

}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
